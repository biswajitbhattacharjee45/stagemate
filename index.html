/* ════════════════════════════════════════════════════════════
   MUSIC THEORY — scales & auto-chords
════════════════════════════════════════════════════════════ */
const NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const noteIdx = (n) => NOTES.indexOf(n);
const shift = (n, semis) => { const i = noteIdx(n); return i < 0 ? n : NOTES[(i + semis + 120) % 12]; };

// Parse "C# minor" / "D" / "Gm" etc → {root, minor} or null
function parseScale(s) {
  if (!s) return null;
  const m = String(s).trim().match(/^([A-Ga-g])(#|b)?\s*(m\b|min|minor)?/);
  if (!m) return null;
  let root = m[1].toUpperCase();
  if (m[2] === "#") root += "#";
  if (m[2] === "b") root = shift(root, -1); // flats → sharp equivalent
  if (noteIdx(root) < 0) return null;
  return { root, minor: !!m[3] };
}
function scaleLabel(p) { return p ? p.root + (p.minor ? " minor" : " major") : ""; }

// Common chords for a key (factual music theory: I IV V vi ii / i iv v VI III VII)
function chordsForScale(s) {
  const p = parseScale(s);
  if (!p) return [];
  const { root, minor } = p;
  if (!minor) {
    return [
      { ch: root,              tag: "I"  },
      { ch: shift(root,5),     tag: "IV" },
      { ch: shift(root,7),     tag: "V"  },
      { ch: shift(root,9)+"m", tag: "vi" },
      { ch: shift(root,2)+"m", tag: "ii" },
    ];
  }
  return [
    { ch: root+"m",          tag: "i"   },
    { ch: shift(root,5)+"m", tag: "iv"  },
    { ch: shift(root,7),     tag: "V"   },
    { ch: shift(root,8),     tag: "VI"  },
    { ch: shift(root,3),     tag: "III" },
    { ch: shift(root,10),    tag: "VII" },
  ];
}
function transposeScale(s, semis) {
  const p = parseScale(s);
  if (!p) return s;
  return shift(p.root, semis) + (p.minor ? " minor" : "");
}

/* ════════════════════════════════════════════════════════════

════════════════════════════════════════════════════════════ */
// Detect dominant script: Hindi (Devanagari), Bangla (Bengali), or Latin
function detectScript(t) {
  if (!t) return "latin";
  let dev = 0, ben = 0;
  for (const ch of t) {
    const c = ch.codePointAt(0);
    if (c >= 0x0900 && c <= 0x097F) dev++;
    else if (c >= 0x0980 && c <= 0x09FF) ben++;
  }
  if (ben > dev && ben > 5) return "bangla";
  if (dev > ben && dev > 5) return "hindi";
  return "latin";
}
const SCRIPT_FONT = {
  latin:  "'DM Sans', sans-serif",

// Clean pasted text: removes site junk so every song looks identical in the app
function cleanLyrics(t) {
  if (!t) return t;
  return t
    .replace(/\r\n?/g, "\n")                 // windows/mac line endings → \n
    .replace(/\u00a0/g, " ")                  // non-breaking spaces → normal
    .replace(/[\u200b-\u200f\u202a-\u202e\ufeff]/g, "") // invisible/zero-width chars
    .replace(/[“”]/g, '"').replace(/[‘’]/g, "'")        // smart quotes → plain
    .split("\n").map(l => l.trim()).join("\n")           // trim each line
    .replace(/[ \t]{2,}/g, " ")               // collapse multiple spaces
    .replace(/\n{3,}/g, "\n\n")               // max one blank line between stanzas
    .trim();
}

════════════════════════════════════════════════════════════ */
const LS_KEY = "stagemate_songs_v1";
const LS_SET = "stagemate_setlist_v1";
function loadSongs() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data.songs)) return data.songs;
    }
  } catch {}
  // first run → seed
  const seeded = SEED.map((s, i) => ({
    id: "s" + i,
    ...s,
    myScale: "", startNote: "", taal: "", notes: "", lyrics: "",
    repertoire: false,
  }));
  try { localStorage.setItem(LS_KEY, JSON.stringify({ v: SEED_VERSION, songs: seeded })); } catch {}
  return seeded;
}
function persistSongs(songs) {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ v: SEED_VERSION, songs })); } catch {}
}

/* ════════════════════════════════════════════════════════════
   CLOUD SYNC — one Firestore document per song (collision-free),
   offline persistence enabled, anonymous sign-in for security
════════════════════════════════════════════════════════════ */
const fsdb = window.__db || null;
async function fsSaveSong(song) {
  if (!fsdb) return;
  try { await fsdb.collection("songs").doc(String(song.id)).set(song); } catch (e) { console.warn("sync:", e.message); }
}
async function fsDeleteSong(id) {
  if (!fsdb) return;
  try { await fsdb.collection("songs").doc(String(id)).delete(); } catch (e) {}
}
async function fsSaveSetlist(ids) {
  if (!fsdb) return;
  try { await fsdb.collection("config").doc("setlist").set({ ids }); } catch (e) {}
}
async function fsPushAll(songs) {
  if (!fsdb) return;
  try { await Promise.all(songs.map(s => fsdb.collection("songs").doc(String(s.id)).set(s))); } catch (e) {}
}

const langMeta = {
  H: { label: "Hindi",    color: T.hindi },
  B: { label: "Bangla",   color: T.bangla },
  R: { label: "Rabindra", color: T.rabindra },
};

const Chip = ({ children, color, onClick, active }) => (
  <button onClick={onClick} style={{
    background: active ? color + "33" : T.card2,
    border: `1.5px solid ${active ? color : T.border}`,
    color: active ? color : T.sub,
    borderRadius: 20, padding: "6px 14px", fontSize: 12, fontWeight: 700,
    cursor: "pointer", whiteSpace: "nowrap",
  }}>{children}</button>
);

const Field = ({ label, value, onChange, placeholder, type }) => (
  <div style={{ marginBottom: 12 }}>
    <label style={{ fontSize: 10, color: T.sub, letterSpacing: 1.2, fontWeight: 700, textTransform: "uppercase" }}>{label}</label>
    <input type={type||"text"} value={value||""} onChange={e => onChange(e.target.value)} placeholder={placeholder||""}
      style={{ display: "block", width: "100%", marginTop: 4, padding: "10px 12px",
        background: T.card2, border: `1px solid ${T.border}`, borderRadius: 10,
        color: T.text, fontSize: 14, boxSizing: "border-box", outline: "none" }} />
  </div>
);

const ChordChips = ({ scale }) => {
  const chords = chordsForScale(scale);
  if (!chords.length) return <span style={{ fontSize: 12, color: T.sub }}>Set a scale to see chords</span>;
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
      {chords.map(c => (
        <div key={c.tag} style={{ background: T.card2, border: `1px solid ${T.border}`, borderRadius: 10, padding: "6px 12px", textAlign: "center" }}>
          <div style={{ fontSize: 15, fontWeight: 800, color: T.amber2, fontFamily: "'Fraunces', serif" }}>{c.ch}</div>
          <div style={{ fontSize: 9, color: T.sub, letterSpacing: 1 }}>{c.tag}</div>
        </div>
      ))}
    </div>
  );
};

/* ════════════════════════════════════════════════════════════
   MAIN APP
════════════════════════════════════════════════════════════ */
function App() {
  const [songs, setSongs] = useState(loadSongs);
  const [q, setQ] = useState("");
  const [langF, setLangF] = useState("ALL");
  const [repOnly, setRepOnly] = useState(false);
  const [openSong, setOpenSong] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [setlist, setSetlist] = useState(() => { try { return JSON.parse(localStorage.getItem(LS_SET)) || []; } catch { return []; } });
  const [tab, setTab] = useState("songs"); // songs | setlist
  const [sync, setSync] = useState(fsdb ? "connecting" : "local"); // connecting | synced | saving | local
  const songsRef = useRef(songs);
  useEffect(() => { songsRef.current = songs; }, [songs]);
  const searchRef = useRef(null);

  // ── Cloud subscription: starts after anonymous sign-in succeeds ──
  useEffect(() => {
    if (!fsdb || !window.__auth) { setSync("local"); return; }
    let unsubs = [];
    let migrated = false;
    const stopAuth = window.__auth.onAuthStateChanged(user => {
      if (!user) return;
      unsubs.push(fsdb.collection("songs").onSnapshot(snap => {
        if (snap.empty && !migrated) {
          // First run: this device's songs become the cloud copy
          migrated = true;
          setSync("saving");
          fsPushAll(songsRef.current).then(() => setSync("synced"));
          return;
        }
        if (!snap.empty) {
          const arr = snap.docs.map(d => ({ ...d.data(), id: d.id }));
          setSongs(arr);
          setSync(snap.metadata.hasPendingWrites ? "saving" : "synced");
        }
      }, () => setSync("local")));
      unsubs.push(fsdb.collection("config").doc("setlist").onSnapshot(snap => {
        if (snap.exists) { const d = snap.data(); if (Array.isArray(d.ids)) setSetlist(d.ids); }
      }, () => {}));
    });
    window.__auth.signInAnonymously().catch(() => setSync("local"));
    return () => { stopAuth(); unsubs.forEach(u => { try { u(); } catch {} }); };
  }, []);

  useEffect(() => persistSongs(songs), [songs]);
  useEffect(() => { try { localStorage.setItem(LS_SET, JSON.stringify(setlist)); } catch {} }, [setlist]);

  const saveSong = (s) => { setSongs(prev => prev.map(x => x.id === s.id ? s : x)); fsSaveSong(s); };
  const deleteSong = (id) => {
    setSongs(prev => prev.filter(x => x.id !== id));
    const newSet = setlist.filter(x => x !== id);
    setSetlist(newSet);
    fsDeleteSong(id); fsSaveSetlist(newSet);
  };
  const addSong = (f) => {
    const obj = { id: "u" + Date.now(), ...f, year: f.year ? parseInt(f.year) : "", startNote: "", taal: "", notes: "", lyrics: "", repertoire: true };
    setSongs(prev => [obj, ...prev]);
    fsSaveSong(obj);
  };

  const filtered = useMemo(() => {
    const needle = q.trim().toLowerCase();
    return songs.filter(s => {
      if (langF !== "ALL" && s.lang !== langF) return false;
      if (repOnly && !s.repertoire) return false;
      if (!needle) return true;
      return (s.title + " " + s.source + " " + (s.md||"") + " " + (s.lyr||"")).toLowerCase().includes(needle);
    }).sort((a,b) => a.title.localeCompare(b.title));
  }, [songs, q, langF, repOnly]);

  const inSet = (id) => setlist.includes(id);
  const toggleSet = (id) => { const arr = inSet(id) ? setlist.filter(x => x !== id) : [...setlist, id]; setSetlist(arr); fsSaveSetlist(arr); };
  const moveSet = (idx, dir) => {
    const arr = [...setlist]; const j = idx + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[idx], arr[j]] = [arr[j], arr[idx]];
    setSetlist(arr); fsSaveSetlist(arr);
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ songs, setlist }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "stagemate_backup_" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
  };
  const importData = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (Array.isArray(d.songs)) { setSongs(d.songs); if (Array.isArray(d.setlist)) { setSetlist(d.setlist); fsSaveSetlist(d.setlist); } fsPushAll(d.songs); alert("✅ Backup restored!"); }
        else alert("❌ Invalid backup file.");
      } catch { alert("❌ Could not read file."); }
    };
    r.readAsText(file);
    e.target.value = "";
  };

  const counts = useMemo(() => ({
    H: songs.filter(s => s.lang === "H").length,
    B: songs.filter(s => s.lang === "B").length,
    R: songs.filter(s => s.lang === "R").length,
    rep: songs.filter(s => s.repertoire).length,
  }), [songs]);

  return (
    <div style={{ minHeight: "100vh", background: T.bg, color: T.text, paddingBottom: 90 }}>
      {/* Ambient stage glow */}
      <div style={{ position: "fixed", top: -160, left: "50%", transform: "translateX(-50%)", width: 520, height: 380, background: `radial-gradient(ellipse, ${T.amber}14 0%, transparent 65%)`, pointerEvents: "none", animation: "glow 6s ease-in-out infinite" }} />

      {/* ── HEADER ── */}
      <div style={{ padding: "26px 18px 6px", maxWidth: 640, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: 30, fontWeight: 800, color: T.text, letterSpacing: -0.5 }}>
              Stage<span style={{ color: T.amber }}>Mate</span> <span style={{ fontSize: 18 }}>🎙️</span>
            </div>
            <div style={{ fontSize: 11, color: T.sub, marginTop: 2 }}>
              Kishore Kumar Edition · {songs.length} songs · {counts.rep} in repertoire
              <span style={{ marginLeft: 8, fontWeight: 700, color: sync === "synced" ? T.green : sync === "saving" || sync === "connecting" ? T.amber : T.sub }}>
                {sync === "synced" ? "☁️ Synced" : sync === "saving" ? "☁️ Saving…" : sync === "connecting" ? "☁️ Connecting…" : "📱 Local only"}
              </span>
            </div>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={exportData} title="Backup" style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 10, color: T.sub, padding: "8px 10px", fontSize: 14, cursor: "pointer" }}>⬇️</button>
            <label title="Restore" style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 10, color: T.sub, padding: "8px 10px", fontSize: 14, cursor: "pointer" }}>
              ⬆️<input type="file" accept=".json" onChange={importData} style={{ display: "none" }} />
            </label>
          </div>
        </div>
      </div>

      {tab === "songs" && (
        <div style={{ maxWidth: 640, margin: "0 auto", padding: "12px 18px" }}>
          {/* ── SEARCH ── */}
          <div style={{ position: "relative", marginBottom: 14 }}>
            <span style={{ position: "absolute", left: 16, top: "50%", transform: "translateY(-50%)", fontSize: 16, color: T.sub }}>🔍</span>
            <input ref={searchRef} value={q} onChange={e => setQ(e.target.value)}
              placeholder="Search song, film, music director…"
              style={{ width: "100%", padding: "15px 44px", background: T.card, border: `1.5px solid ${q ? T.amber : T.border}`, borderRadius: 16, color: T.text, fontSize: 16, boxSizing: "border-box", outline: "none" }} />
            {q && <button onClick={() => { setQ(""); searchRef.current?.focus(); }} style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", background: T.card2, border: "none", borderRadius: "50%", width: 26, height: 26, color: T.sub, cursor: "pointer", fontSize: 13 }}>✕</button>}
          </div>

          {/* ── FILTERS ── */}
          <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 6, marginBottom: 10 }}>
            <Chip active={langF === "ALL"} color={T.text} onClick={() => setLangF("ALL")}>All ({songs.length})</Chip>
            <Chip active={langF === "H"} color={T.hindi} onClick={() => setLangF("H")}>Hindi ({counts.H})</Chip>
            <Chip active={langF === "B"} color={T.bangla} onClick={() => setLangF("B")}>Bangla ({counts.B})</Chip>
            <Chip active={langF === "R"} color={T.rabindra} onClick={() => setLangF("R")}>Rabindra ({counts.R})</Chip>
            <Chip active={repOnly} color={T.green} onClick={() => setRepOnly(r => !r)}>⭐ Repertoire</Chip>
          </div>

          {/* ── DISCLAIMER (shows once-ish, small) ── */}
          <div style={{ fontSize: 10.5, color: T.sub, marginBottom: 14, lineHeight: 1.5, opacity: .8 }}>
            ℹ️ Scales marked are approximate — verify on your harmonium & edit. Credits are editable. Lyrics open from licensed sources.
          </div>

          {/* ── SONG LIST ── */}
          {filtered.length === 0 ? (
            <div style={{ textAlign: "center", padding: "50px 20px", color: T.sub }}>
              <div style={{ fontSize: 36, marginBottom: 10 }}>🎵</div>
              <div style={{ fontSize: 14 }}>No songs found{q ? ` for "${q}"` : ""}.</div>
              <button onClick={() => setShowAdd(true)} style={{ marginTop: 14, background: T.amber, color: "#1a1207", border: "none", borderRadius: 12, padding: "10px 20px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>＋ Add it now</button>
            </div>
          ) : filtered.map(s => {
            const meta = langMeta[s.lang] || langMeta.H;
            const sc = s.myScale || s.scale;
            return (
              <div key={s.id} onClick={() => setOpenSong(s)} style={{
                background: T.card, border: `1px solid ${T.border}`, borderLeft: `3px solid ${meta.color}`,
                borderRadius: 14, padding: "14px 16px", marginBottom: 10, cursor: "pointer",
                display: "flex", alignItems: "center", gap: 12,
              }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: "'Fraunces', serif", fontSize: 16, fontWeight: 700, color: T.text, marginBottom: 3, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    {s.repertoire && <span style={{ color: T.green }}>⭐ </span>}{s.title}{(s.lyrics||"").trim() && <span style={{ color: T.violet, fontSize: 12 }}> 📜</span>}
                  </div>
                  <div style={{ fontSize: 11.5, color: T.sub }}>
                    {s.source}{s.year ? ` · ${s.year}` : ""} · {s.md || "—"}
                  </div>
                </div>
                {sc && (
                  <div style={{ background: T.card2, borderRadius: 10, padding: "7px 11px", textAlign: "center", flexShrink: 0 }}>
                    <div style={{ fontFamily: "'Fraunces', serif", fontSize: 14, fontWeight: 800, color: s.myScale ? T.amber2 : T.sub }}>{(parseScale(sc)?.root || sc)}{parseScale(sc)?.minor ? "m" : ""}</div>
                  </div>
                )}
                <button onClick={e => { e.stopPropagation(); toggleSet(s.id); }} title="Add to setlist" style={{
                  background: inSet(s.id) ? T.violet + "33" : "transparent",
                  border: `1.5px solid ${inSet(s.id) ? T.violet : T.border}`,
                  color: inSet(s.id) ? T.violet : T.sub,
                  borderRadius: 10, width: 36, height: 36, fontSize: 15, cursor: "pointer", flexShrink: 0,
                }}>{inSet(s.id) ? "✓" : "＋"}</button>
              </div>
            );
          })}
        </div>
      )}

      {/* ── SETLIST TAB ── */}
      {tab === "setlist" && (
        <div style={{ maxWidth: 640, margin: "0 auto", padding: "12px 18px" }}>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 20, fontWeight: 800, marginBottom: 4 }}>Tonight's Setlist 🎶</div>
          <div style={{ fontSize: 12, color: T.sub, marginBottom: 18 }}>{setlist.length} songs · tap a song to open · use arrows to reorder</div>
          {setlist.length === 0 ? (
            <div style={{ textAlign: "center", padding: "60px 20px", color: T.sub }}>
              <div style={{ fontSize: 36, marginBottom: 10 }}>🎤</div>
              <div style={{ fontSize: 14 }}>Setlist is empty.<br/>Tap ＋ on any song to add it here.</div>
            </div>
          ) : setlist.map((id, idx) => {
            const s = songs.find(x => x.id === id);
            if (!s) return null;
            const sc = s.myScale || s.scale;
            return (
              <div key={id} style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 14, padding: "12px 14px", marginBottom: 10, display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ fontFamily: "'Fraunces', serif", fontSize: 20, fontWeight: 800, color: T.amber, width: 28, textAlign: "center", flexShrink: 0 }}>{idx + 1}</div>
                <div onClick={() => setOpenSong(s)} style={{ flex: 1, minWidth: 0, cursor: "pointer" }}>
                  <div style={{ fontSize: 15, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.title}</div>
                  <div style={{ fontSize: 11, color: T.sub }}>{s.source}{sc ? ` · ${scaleLabel(parseScale(sc)) || sc}` : ""}</div>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                  <button onClick={() => moveSet(idx, -1)} style={{ background: T.card2, border: "none", borderRadius: 6, color: T.sub, width: 28, height: 22, cursor: "pointer", fontSize: 11 }}>▲</button>
                  <button onClick={() => moveSet(idx, 1)} style={{ background: T.card2, border: "none", borderRadius: 6, color: T.sub, width: 28, height: 22, cursor: "pointer", fontSize: 11 }}>▼</button>
                </div>
                <button onClick={() => toggleSet(id)} style={{ background: "transparent", border: `1px solid ${T.red}44`, color: T.red, borderRadius: 8, width: 30, height: 30, cursor: "pointer", fontSize: 12 }}>✕</button>
              </div>
            );
          })}
          {setlist.length > 0 && (
            <button onClick={() => { if (window.confirm("Clear the entire setlist?")) { setSetlist([]); fsSaveSetlist([]); } }} style={{ width: "100%", marginTop: 8, padding: 12, borderRadius: 12, cursor: "pointer", fontSize: 12, fontWeight: 700, background: "transparent", color: T.red, border: `1px solid ${T.red}44` }}>Clear Setlist</button>
          )}
        </div>
      )}

      {/* ── BOTTOM NAV ── */}
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: T.panel + "f5", backdropFilter: "blur(10px)", borderTop: `1px solid ${T.border}`, display: "flex", justifyContent: "space-around", alignItems: "center", padding: "10px 8px calc(10px + env(safe-area-inset-bottom))", zIndex: 100 }}>
        <button onClick={() => setTab("songs")} style={{ background: "transparent", border: "none", color: tab === "songs" ? T.amber : T.sub, fontSize: 12, fontWeight: 800, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
          <span style={{ fontSize: 20 }}>🎵</span>Songs
        </button>
        <button onClick={() => setShowAdd(true)} style={{ background: `linear-gradient(135deg, ${T.amber}, #e8842a)`, border: "none", borderRadius: "50%", width: 54, height: 54, fontSize: 26, color: "#1a1207", cursor: "pointer", fontWeight: 800, boxShadow: `0 6px 20px ${T.amber}55`, marginTop: -22 }}>＋</button>
        <button onClick={() => setTab("setlist")} style={{ background: "transparent", border: "none", color: tab === "setlist" ? T.amber : T.sub, fontSize: 12, fontWeight: 800, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, position: "relative" }}>
          <span style={{ fontSize: 20 }}>🎶</span>Setlist
          {setlist.length > 0 && <span style={{ position: "absolute", top: -4, right: -10, background: T.violet, color: "#fff", borderRadius: 20, fontSize: 9, fontWeight: 900, padding: "1px 6px" }}>{setlist.length}</span>}
        </button>
      </div>

      {/* ── MODALS ── */}
      {openSong && <SongDetail song={openSong} onClose={() => setOpenSong(null)} onSave={saveSong} onDelete={deleteSong} />}
      {showAdd && <AddSong onAdd={addSong} onClose={() => setShowAdd(false)} />}

      {/* Footer credit */}
      <div style={{ textAlign: "center", fontSize: 10, color: T.sub, opacity: .6, padding: "8px 0 4px" }}>
        StageMate v1 · Conceived by Biswajit Bhattacharjee
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
